name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync-brain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Telma's brain push guard
        run: bash vps/test-sync-brain.sh

  memory-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Telma's memory diff
        run: bash vps/test-memory-diff.sh

  exfil-tripwire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Telma's exfil tripwire
        run: bash vps/test-exfil-tripwire.sh

      - name: Test the tripwire's health check
        run: bash vps/test-tripwire-health.sh

      - name: Test Telma's cron alert
        run: bash vps/test-cron-alert.sh

  drift-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PyYAML for the drift check
        run: sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Test the drift check against a fake host
        run: python3 -m unittest vps/test_check_drift.py

  decoy-brain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the eval's decoy brain matches its generator
        run: python3 evals/decoy-brain/generate.py --check

  eval-grader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the eval grader, report and VPS scripts
        run: python3 -m unittest evals/test_grade.py evals/test_tasks.py evals/test_report.py evals/test_remote.py
